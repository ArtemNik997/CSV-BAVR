<VirtualHost *:80>
    ServerName localhost

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    WSGIDaemonProcess videos python-home=/opt/venv python-path=/app \
                      processes=2 threads=4 display-name=%{GROUP} \
                      lang='C.UTF-8' locale='C.UTF-8'
    WSGIProcessGroup videos
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/app.wsgi

    <Directory /app>
        Require all granted
    </Directory>
</VirtualHost>
